<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Session Garden</title>
<style>body{margin:0;background:#dfe8df;color:#16231f;font:15px/1.5 system-ui,sans-serif}.app{max-width:1100px;margin:5vh auto;padding:24px}.card{padding:32px;border:1px solid #c9d4c8;border-radius:18px;background:#fffaf0;box-shadow:0 16px 40px #2a2e231f}h1{font:700 clamp(32px,7vw,64px)/1 Georgia,serif;margin:0 0 12px}.state,.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#72807a;color:white;font-size:12px}.muted{color:#65736e}.garden{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px}.session{padding:20px;border:1px solid #c9d4c8;border-radius:14px;background:#f5f0df}.character{font-size:42px;line-height:1;margin:8px 0}.session h2{font-size:18px;margin:0 0 4px}.stale{background:#927d61}.status-coding{background:#477c59}.status-tool_calling{background:#55769a}.status-researching{background:#765d9b}.status-waiting_for_user{background:#a87542}.status-waiting_for_permission{background:#a04f58}.status-waiting_for_system{background:#72807a}.status-completed{background:#3c8068}.status-failed{background:#9b4141}.status-unknown{background:#60666a}</style></head>
<body><main class="app"><section class="card"><span id="state" class="state">connecting</span><h1>Agent Session Garden</h1><p id="message" class="muted">Connecting to the local observation stream.</p><p id="count"></p><div id="garden" class="garden"></div></section></main>
<script>const state=document.querySelector('#state'),message=document.querySelector('#message'),count=document.querySelector('#count'),garden=document.querySelector('#garden');const labels={coding:['studio','writing'],tool_calling:['workbench','using a tool'],researching:['library','researching'],waiting_for_user:['front desk','waiting for user'],waiting_for_permission:['front desk','waiting for permission'],waiting_for_system:['lounge','waiting for system'],completed:['archive','completed'],failed:['archive','failed'],unknown:['garden path','unknown']};function render(data){const sessions=data.sessions||[];state.textContent=sessions.length?'connected':'empty garden';message.textContent=sessions.length?'Observation stream connected.':'No OpenCode sessions are currently available for this Project.';count.textContent=`${sessions.length} sessions observed`;garden.replaceChildren(...sessions.map(s=>{const [location,pose]=labels[s.status.primary]||labels.unknown;const detail=s.activity?.summary||s.activity?.name||'No active detail';const stale=s.status.freshness==='stale';const card=document.createElement('article');card.className='session';const badge=document.createElement('span');badge.className=`badge status-${s.status.primary}`;badge.textContent=s.status.primary.replaceAll('_',' ');card.append(badge);if(stale){const fresh=document.createElement('span');fresh.className='badge stale';fresh.textContent='stale';card.append(fresh);}const character=document.createElement('div');character.className='character';character.title=`${location} · ${pose}`;character.textContent=s.status.primary==='coding'?'W':s.status.primary==='researching'?'?':s.status.primary==='completed'?'OK':'*';card.append(character);const title=document.createElement('h2');title.textContent=s.displayName;card.append(title);const place=document.createElement('div');place.textContent=`${location} · ${pose}`;card.append(place);const summary=document.createElement('p');summary.className='muted';summary.textContent=detail;card.append(summary);return card;}));}function snapshot(){return fetch('/api/sessions').then(r=>r.ok?r.json():Promise.reject()).then(render);}snapshot().catch(()=>{state.textContent='disconnected';message.textContent='The Garden Server is unavailable. Reconnect to see this Project.';});const events=new EventSource('/api/events');events.onerror=()=>{state.textContent='disconnected';message.textContent='The Garden Server is unavailable. Reconnect to see this Project.';};events.onopen=()=>snapshot().catch(()=>{});</script></body></html>
