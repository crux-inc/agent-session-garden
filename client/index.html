<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Session Garden</title>
<style>body{margin:0;background:#dfe8df;color:#16231f;font:15px/1.5 system-ui,sans-serif}.app{max-width:1100px;margin:6vh auto;padding:24px}.card{padding:28px;border:1px solid #c9d4c8;border-radius:18px;background:#fffaf0;box-shadow:0 16px 40px #2a2e231f}h1{font:700 clamp(32px,7vw,64px)/1 Georgia,serif;margin:0 0 12px}.state{display:inline-block;padding:5px 9px;border-radius:99px;background:#72807a;color:white;font-size:12px}.muted{color:#65736e}.sessions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:24px}.session{border:1px solid #c9d4c8;border-radius:12px;padding:16px;background:#f8f3e8;text-align:left;cursor:pointer;color:inherit}.session.selected{outline:3px solid #72807a}.detail{margin-top:20px;padding-top:20px;border-top:1px solid #c9d4c8}.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.fact b{display:block;font-size:12px;text-transform:uppercase;color:#65736e}.raw{white-space:pre-wrap;background:#16231f;color:#fffaf0;padding:12px;border-radius:8px;overflow:auto}</style></head>
 <body><main class="app"><section class="card"><span id="state" class="state">connecting</span><h1>Agent Session Garden</h1><p id="message" class="muted">Connecting to the local observation stream.</p><p id="count"></p><div id="sessions" class="sessions"></div><div id="detail" class="detail" hidden></div></section></main>
 <script>const state=document.querySelector('#state'),message=document.querySelector('#message'),count=document.querySelector('#count'),sessions=document.querySelector('#sessions'),detail=document.querySelector('#detail');let current=[],selected=null;function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function render(){sessions.innerHTML=current.map(s=>`<button class="session ${s.sessionId===selected?'selected':''}" data-id="${esc(s.sessionId)}"><strong>${esc(s.displayName)}</strong><br><span class="muted">${esc(s.status.primary)} · ${esc(s.agent.gardenRole)}</span></button>`).join('');sessions.querySelectorAll('button').forEach(button=>button.onclick=()=>{selected=button.dataset.id;render();});const s=current.find(item=>item.sessionId===selected);if(!s){detail.hidden=true;return;}detail.hidden=false;detail.innerHTML=`<h2>${esc(s.displayName)}</h2><div class="facts"><div class="fact"><b>Session</b>${esc(s.sessionId.slice(0,8))}</div><div class="fact"><b>Agent / Role</b>${esc(s.agent.name)} / ${esc(s.agent.gardenRole)}</div><div class="fact"><b>Model</b>${esc(s.model.provider)} / ${esc(s.model.id)}</div><div class="fact"><b>Status</b>${esc(s.status.primary)} (${esc(s.status.freshness)})</div><div class="fact"><b>Activity</b>${esc(s.activity?.name||s.activity?.kind||'none')}</div><div class="fact"><b>Lifetime</b>${esc(s.lifetime.startedAt)} to ${esc(s.lifetime.endedAt||'now')}</div></div><p>${esc(s.activity?.summary||'No recent activity summary.')}</p><button id="expand">Show masked raw content</button><div id="raw"></div>`;detail.querySelector('#expand').onclick=async()=>{const content=await fetch('/api/sessions/'+encodeURIComponent(s.sessionId)+'/content').then(r=>r.json());detail.querySelector('#raw').innerHTML=`<pre class="raw">${esc(JSON.stringify(content,null,2))}</pre>`;};}function snapshot(){return fetch('/api/sessions').then(r=>r.ok?r.json():Promise.reject()).then(data=>{current=data.sessions;state.textContent=current.length?'connected':'empty garden';message.textContent=current.length?'Observation stream connected.':'No OpenCode sessions are currently available for this Project.';count.textContent=`${current.length} sessions observed`;render();});}snapshot().catch(()=>{state.textContent='disconnected';message.textContent='The Garden Server is unavailable. Reconnect to see this Project.';});const events=new EventSource('/api/events');events.onerror=()=>{state.textContent='disconnected';message.textContent='The Garden Server is unavailable. Reconnect to see this Project.';};events.addEventListener('snapshot',event=>{const data=JSON.parse(event.data);current=data.sessions;render();});events.onopen=()=>snapshot().catch(()=>{});</script></body></html>
