<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Session Garden</title>
<style>body{margin:0;background:#dfe8df;color:#16231f;font:15px/1.5 system-ui,sans-serif}.app{max-width:900px;margin:10vh auto;padding:24px}.card{padding:32px;border:1px solid #c9d4c8;border-radius:18px;background:#fffaf0;box-shadow:0 16px 40px #2a2e231f}h1{font:700 clamp(32px,7vw,64px)/1 Georgia,serif;margin:0 0 12px}.state{display:inline-block;padding:5px 9px;border-radius:99px;background:#72807a;color:white;font-size:12px}.muted{color:#65736e}</style></head>
<body><main class="app"><section class="card"><span id="state" class="state">connecting</span><h1>Agent Session Garden</h1><p id="message" class="muted">Connecting to the local observation stream.</p><p id="count"></p></section></main>
<script>const state=document.querySelector('#state'),message=document.querySelector('#message'),count=document.querySelector('#count');function snapshot(){return fetch('/api/sessions').then(r=>r.ok?r.json():Promise.reject()).then(data=>{state.textContent=data.sessions.length?'connected':'empty garden';message.textContent=data.sessions.length?'Observation stream connected.':'No OpenCode sessions are currently available for this Project.';count.textContent=`${data.sessions.length} sessions observed`;});}snapshot().catch(()=>{state.textContent='disconnected';message.textContent='The Garden Server is unavailable. Reconnect to see this Project.';});const events=new EventSource('/api/events');events.onerror=()=>{state.textContent='disconnected';message.textContent='The Garden Server is unavailable. Reconnect to see this Project.';};events.onopen=()=>snapshot().catch(()=>{});</script></body></html>
